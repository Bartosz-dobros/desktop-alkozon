name: Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Code Style Check

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Black (format check)
        run: black --check --diff src/ tests/

      - name: Run isort (import check)
        run: isort --check-only --diff src/ tests/

      - name: Run Ruff (linting)
        run: ruff check src/ tests/

  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest pytest-asyncio pytest-mock email-validator

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v

  integration-tests:
    runs-on: ubuntu-latest
    name: Integration Tests
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest pytest-asyncio pytest-mock email-validator

      - name: Run integration tests
        run: python -m pytest tests/integration/ -v

  api-tests:
    runs-on: ubuntu-latest
    name: API Tests
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest pytest-asyncio pytest-mock email-validator

      - name: Run API tests
        run: python -m pytest tests/api/ -v

  feature-tests:
    runs-on: ubuntu-latest
    name: Feature Tests
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest pytest-asyncio pytest-mock email-validator

      - name: Run feature tests
        run: python -m pytest tests/feature/ -v

  ui-tests:
    runs-on: ubuntu-latest
    name: UI Tests
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest pytest-asyncio pytest-mock email-validator

      - name: Run UI tests
        run: python -m pytest tests/ui/ -v
